[package]
name = "rust-pty"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true # Automatically strip symbols from the binary
opt-level = 3
lto = "fat"
codegen-units = 1


[lib]
crate-type = ["cdylib"]

[dependencies]
# ponytail: pinned fork adds CREATE_NO_WINDOW; update deliberately when upstream catches up.
portable-pty = { git = "https://github.com/ryancole03/wezterm.git", rev = "c02fe9b4d", features = ["serde_support"] }
lazy_static = "1.4"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.0"
